name: Generate retail analysis and dashboard screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "dashboard.py"
      - ".github/workflows/generate-analysis.yml"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run analysis on the official UCI dataset
        run: python -m src.analysis
      - name: Launch dashboard and capture screenshots
        run: |
          mkdir -p outputs/screenshots
          streamlit run dashboard.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1100}, device_scale_factor=1)
              for attempt in range(40):
                  try:
                      page.goto("http://127.0.0.1:8501", wait_until="networkidle", timeout=15000)
                      break
                  except Exception:
                      time.sleep(2)
              page.screenshot(path="outputs/screenshots/dashboard_full.png", full_page=True)
              page.screenshot(path="outputs/screenshots/dashboard_top.png", full_page=False)
              browser.close()
          PY
      - name: Run tests
        run: pytest -q
      - name: Upload generated analysis and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: retail-analysis-results
          path: |
            outputs/metrics.json
            outputs/charts/*.png
            outputs/screenshots/*.png
            data/processed/*.csv
            reports/analysis_report.md
          if-no-files-found: error
